name: Create/Update/Delete AWS Secret via CloudFormation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to perform (create/update/delete)"
        required: true
        type: choice
        options:
          - create
          - update
          - delete

      parameter_file:
        description: "Parameter file name (for create/update)"
        required: false
        default: "secret-params.json"

      environment:
        description: "Environment (dev/qa/staging/perf)"
        required: false
        type: choice
        options:
          - dev
          - qa
          - staging
          - perf

      stack_name:
        description: "Stack name (required for update/delete)"
        required: false

env:
  AWS_REGION: ap-south-1

jobs:
  secret-ops:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::789406175361:role/GitHubActionsOIDCRole
          aws-region: ap-south-1
          role-session-name: GitHubActions-SecretOps

      # -------------------------------------------------------
      # Initialize Variables
      # -------------------------------------------------------
      - name: Initialize Variables
        id: init-vars
        run: |
          OP="${{ inputs.operation }}"
          ENV="${{ inputs.environment }}"
          PARAM_FILE="${{ inputs.parameter_file }}"
          STACK_INPUT="${{ inputs.stack_name }}"
          CF_TEMPLATE="cloudformation/secret-manager.yaml"

          echo "operation=$OP" >> $GITHUB_OUTPUT
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "param-file=$PARAM_FILE" >> $GITHUB_OUTPUT
          echo "stack-input=$STACK_INPUT" >> $GITHUB_OUTPUT
          echo "cf-template=$CF_TEMPLATE" >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # Read + Validate Parameter File (CREATE + UPDATE)
      # -------------------------------------------------------
      - name: Read Parameter File
        id: read-params
        if: ${{ steps.init-vars.outputs.operation != 'delete' }}
        run: |
          PARAM_PATH="parameters/${{ steps.init-vars.outputs.param-file }}"

          echo "🔍 Using parameter file: $PARAM_PATH"

          if [ ! -f "$PARAM_PATH" ]; then
            echo "❌ Parameter file not found"
            exit 1
          fi

          if ! jq empty "$PARAM_PATH" 2>/dev/null; then
            echo "❌ ERROR: Invalid JSON format"
            exit 1
          fi

          if ! jq -e '.SecretName' "$PARAM_PATH" >/dev/null; then
            echo "❌ Missing SecretName"
            exit 1
          fi

          if ! jq -e '.SecretValue' "$PARAM_PATH" >/dev/null; then
            echo "❌ Missing SecretValue"
            exit 1
          fi

          if ! jq -e '.SecretValue | objects' "$PARAM_PATH" >/dev/null; then
            echo "❌ SecretValue must be a JSON object"
            exit 1
          fi

          SECRET_NAME=$(jq -r '.SecretName' "$PARAM_PATH")
          SECRET_DESCRIPTION=$(jq -r '.Description // "Managed by CloudFormation"' "$PARAM_PATH")
          SECRET_VALUE=$(jq -c '.SecretValue' "$PARAM_PATH")
          KMS_KEY_ID=$(jq -r '.KmsKeyId // ""' "$PARAM_PATH")

          echo "::add-mask::$SECRET_VALUE"

          echo "secret-name=$SECRET_NAME" >> $GITHUB_OUTPUT
          echo "secret-description=$SECRET_DESCRIPTION" >> $GITHUB_OUTPUT
          echo "kms-key-id=$KMS_KEY_ID" >> $GITHUB_OUTPUT

          {
            echo "secret-value<<EOF"
            echo "$SECRET_VALUE"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # CREATE STACK
      # -------------------------------------------------------
      - name: CREATE Secret Stack
        if: ${{ steps.init-vars.outputs.operation == 'create' }}
        id: create-stack
        run: |
          ENV="${{ steps.init-vars.outputs.env }}"
          SECRET_NAME="${{ steps.read-params.outputs.secret-name }}"
          STACK_NAME="secret-${SECRET_NAME}-${ENV}"
          CF_TEMPLATE="${{ steps.init-vars.outputs.cf-template }}"

          echo "stack-name=$STACK_NAME" >> $GITHUB_OUTPUT

          echo "🚀 Creating stack: $STACK_NAME"

          aws cloudformation deploy \
            --template-file "$CF_TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
                SecretName="$SECRET_NAME" \
                SecretDescription="${{ steps.read-params.outputs.secret-description }}" \
                SecretValue="${{ steps.read-params.outputs.secret-value }}" \
                Environment="$ENV" \
                $( [ -n "${{ steps.read-params.outputs.kms-key-id }}" ] && echo KmsKeyId="${{ steps.read-params.outputs.kms-key-id }}" ) \
            --no-fail-on-empty-changeset

          if [ $? -ne 0 ]; then
            echo "❌ CREATE failed — showing events..."
            aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --output table | head -n 50

            echo "🧹 Cleaning failed stack..."
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
            exit 1
          fi

      # -------------------------------------------------------
      # UPDATE STACK
      # -------------------------------------------------------
      - name: UPDATE Secret Stack
        if: ${{ steps.init-vars.outputs.operation == 'update' }}
        id: update-stack
        run: |
          STACK_NAME="${{ steps.init-vars.outputs.stack-input }}"
          CF_TEMPLATE="${{ steps.init-vars.outputs.cf-template }}"

          if [ -z "$STACK_NAME" ]; then
            echo "❌ stack_name is required for update"
            exit 1
          fi

          echo "🔄 Updating stack: $STACK_NAME"

          aws cloudformation deploy \
            --template-file "$CF_TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
                SecretName="${{ steps.read-params.outputs.secret-name }}" \
                SecretDescription="${{ steps.read-params.outputs.secret-description }}" \
                SecretValue="${{ steps.read-params.outputs.secret-value }}" \
                Environment="${{ steps.init-vars.outputs.env }}" \
                $( [ -n "${{ steps.read-params.outputs.kms-key-id }}" ] && echo KmsKeyId="${{ steps.read-params.outputs.kms-key-id }}" ) \
            --no-fail-on-empty-changeset

          if [ $? -ne 0 ]; then
            echo "❌ UPDATE failed — showing events..."
            aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --output table | head -n 50

            echo "⏳ Waiting for rollback..."
            aws cloudformation wait stack-rollback-complete --stack-name "$STACK_NAME"
            exit 1
          fi

      # -------------------------------------------------------
      # DELETE STACK
      # -------------------------------------------------------
      - name: DELETE Secret Stack
        if: ${{ steps.init-vars.outputs.operation == 'delete' }}
        id: delete-stack
        run: |
          STACK_NAME="${{ steps.init-vars.outputs.stack-input }}"

          if [ -z "$STACK_NAME" ]; then
            echo "❌ stack_name is required for delete"
            exit 1
          fi

          echo "🗑 Deleting stack: $STACK_NAME"

          aws cloudformation delete-stack --stack-name "$STACK_NAME"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"

          echo "✅ Stack deleted successfully"

      # -------------------------------------------------------
      # GET SECRET ARN
      # -------------------------------------------------------
      - name: Get Secret ARN
        id: get-arn
        if: ${{ steps.init-vars.outputs.operation != 'delete' }}
        run: |
          if [ "${{ steps.init-vars.outputs.operation }}" = "create" ]; then
            STACK_NAME="${{ steps.create-stack.outputs.stack-name }}"
          else
            STACK_NAME="${{ steps.init-vars.outputs.stack-input }}"
          fi

          echo "Retrieving Secret ARN..."

          SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='SecretArn'].OutputValue" \
            --output text)

          if [ -z "$SECRET_ARN" ]; then
            echo "❌ Failed to fetch Secret ARN"
            exit 1
          fi

          echo "secret-arn=$SECRET_ARN" >> $GITHUB_OUTPUT
          echo "✅ Secret ARN: $SECRET_ARN"

      # -------------------------------------------------------
      # DISPLAY SUMMARY (Dynamic per operation)
      # -------------------------------------------------------
      - name: Display Summary
        run: |
          OP="${{ steps.init-vars.outputs.operation }}"
          ENV="${{ steps.init-vars.outputs.env }}"
          PARAM="${{ steps.init-vars.outputs.param-file }}"
          STACK_INPUT="${{ steps.init-vars.outputs.stack-input }}"
          CF_TEMPLATE="${{ steps.init-vars.outputs.cf-template }}"

          if [ "$OP" = "create" ]; then
            STACK_NAME="${{ steps.create-stack.outputs.stack-name }}"
            SECRET_NAME="${{ steps.read-params.outputs.secret-name }}"
            SECRET_DESC="${{ steps.read-params.outputs.secret-description }}"
            KMS_KEY="${{ steps.read-params.outputs.kms-key-id }}"
            SECRET_ARN="${{ steps.get-arn.outputs.secret-arn }}"

            SUMMARY_CONTENT=$(cat <<EOF
## 🎉 AWS Secret Manager — CREATE SUMMARY

| Field | Value |
|-------|--------|
| **Operation** | create |
| **Environment** | $ENV |
| **Parameter File** | $PARAM |
| **CloudFormation Template** | $CF_TEMPLATE |
| **Secret Name** | $SECRET_NAME |
| **Description** | $SECRET_DESC |
| **KMS Key ID** | $KMS_KEY |
| **Stack Name** | $STACK_NAME |
| **Secret ARN** | \`$SECRET_ARN\` |
| **Region** | $AWS_REGION |
| **Timestamp** | $(date) |

EOF
)

          elif [ "$OP" = "update" ]; then
            STACK_NAME="$STACK_INPUT"
            SECRET_NAME="${{ steps.read-params.outputs.secret-name }}"
            SECRET_DESC="${{ steps.read-params.outputs.secret-description }}"
            KMS_KEY="${{ steps.read-params.outputs.kms-key-id }}"
            SECRET_ARN="${{ steps.get-arn.outputs.secret-arn }}"

            SUMMARY_CONTENT=$(cat <<EOF
## 🔄 AWS Secret Manager — UPDATE SUMMARY

| Field | Value |
|-------|--------|
| **Operation** | update |
| **Environment** | $ENV |
| **Parameter File** | $PARAM |
| **CloudFormation Template** | $CF_TEMPLATE |
| **Secret Name** | $SECRET_NAME |
| **Description** | $SECRET_DESC |
| **KMS Key ID** | $KMS_KEY |
| **Stack Name** | $STACK_NAME |
| **Updated ARN** | \`$SECRET_ARN\` |
| **Region** | $AWS_REGION |
| **Timestamp** | $(date) |

EOF
)

          else
            STACK_NAME="$STACK_INPUT"

            SUMMARY_CONTENT=$(cat <<EOF
## 🗑 AWS Secret Manager — DELETE SUMMARY

| Field | Value |
|-------|--------|
| **Operation** | delete |
| **Stack Deleted** | $STACK_NAME |
| **Region** | $AWS_REGION |
| **Timestamp** | $(date) |

EOF
)

          fi

          echo "$SUMMARY_CONTENT" >> $GITHUB_STEP_SUMMARY
          echo "================== SUMMARY =================="
          echo "$SUMMARY_CONTENT"
          echo "============================================="
