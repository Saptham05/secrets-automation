name: Create/Update/Delete AWS Secret via CloudFormation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to perform (create/update/delete)"
        required: true
        type: choice
        options:
          - create
          - update
          - delete

      parameter_file:
        description: "Parameter file name (for create/update)"
        required: false
        default: "secret-params.json"

      environment:
        description: "Environment (dev/qa/staging/perf)"
        required: false
        type: choice
        options:
          - dev
          - qa
          - staging
          - perf

      stack_name:
        description: "Stack name (required for update/delete)"
        required: false

env:
  AWS_REGION: ap-south-1

jobs:
  secret-ops:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:

      # ------------------------------------------
      # CHECKOUT
      # ------------------------------------------
      - name: Checkout Repo
        uses: actions/checkout@v4

      # ------------------------------------------
      # ASSIGN USER INPUTS TO VARIABLES (MAIN STEP)
      # ------------------------------------------
      - name: Initialize Variables
        id: vars
        run: |
          echo "OPERATION=${{ inputs.operation }}" >> $GITHUB_ENV
          echo "PARAM_FILE=${{ inputs.parameter_file }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
          echo "STACK_NAME_INPUT=${{ inputs.stack_name }}" >> $GITHUB_ENV

          echo "🔧 Loaded Variables:"
          echo "OPERATION=$OPERATION"
          echo "PARAM_FILE=$PARAM_FILE"
          echo "ENVIRONMENT=$ENVIRONMENT"
          echo "STACK_NAME_INPUT=$STACK_NAME_INPUT"

      # ------------------------------------------
      # AWS AUTH
      # ------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-SecretOps

      # ------------------------------------------
      # READ PARAM FILE (CREATE / UPDATE ONLY)
      # ------------------------------------------
      - name: Read Parameter File
        id: read-params
        if: ${{ env.OPERATION != 'delete' }}
        run: |
          FINAL_PATH="parameters/${PARAM_FILE}"

          echo "Using param file: $FINAL_PATH"

          if [ ! -f "$FINAL_PATH" ]; then
            echo "❌ Param file not found: $FINAL_PATH"
            exit 1
          fi

          SECRET_NAME=$(jq -r '.SecretName' "$FINAL_PATH")
          SECRET_DESCRIPTION=$(jq -r '.Description // "Managed by CloudFormation"' "$FINAL_PATH")
          SECRET_VALUE=$(jq -c '.SecretValue' "$FINAL_PATH")
          KMS_KEY_ID=$(jq -r '.KmsKeyId // ""' "$FINAL_PATH")

          echo "::add-mask::$SECRET_VALUE"

          echo "SECRET_NAME=$SECRET_NAME" >> $GITHUB_ENV
          echo "SECRET_DESCRIPTION=$SECRET_DESCRIPTION" >> $GITHUB_ENV
          echo "SECRET_VALUE=$SECRET_VALUE" >> $GITHUB_ENV
          echo "KMS_KEY_ID=$KMS_KEY_ID" >> $GITHUB_ENV

      # ------------------------------------------
      # CREATE
      # ------------------------------------------
      - name: Create Secret Stack
        if: ${{ env.OPERATION == 'create' }}
        run: |
          STACK_NAME="secret-${SECRET_NAME}-${ENVIRONMENT}"
          echo "STACK_NAME=$STACK_NAME" >> $GITHUB_ENV

          echo "🚀 Creating stack: $STACK_NAME"

          aws cloudformation deploy \
            --template-file cloudformation/secret-manager/secret-service.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              SecretName="$SECRET_NAME" \
              SecretDescription="$SECRET_DESCRIPTION" \
              SecretValue="$SECRET_VALUE" \
              Environment="$ENVIRONMENT" \
              $( [ -n "$KMS_KEY_ID" ] && echo KmsKeyId="$KMS_KEY_ID" ) \
            --no-fail-on-empty-changeset

          if [ $? -ne 0 ]; then
            echo "❌ CREATE failed → printing events"
            aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --output table | head -n 50

            echo "🧹 Deleting failed stack..."
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"

            exit 1
          fi

      # ------------------------------------------
      # UPDATE
      # ------------------------------------------
      - name: Update Secret Stack
        if: ${{ env.OPERATION == 'update' }}
        run: |
          if [ -z "$STACK_NAME_INPUT" ]; then
            echo "❌ stack_name is required for update"
            exit 1
          fi

          STACK_NAME="$STACK_NAME_INPUT"
          echo "Updating stack: $STACK_NAME"

          aws cloudformation deploy \
            --template-file cloudformation/secret-manager/secret-service.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              SecretName="$SECRET_NAME" \
              SecretDescription="$SECRET_DESCRIPTION" \
              SecretValue="$SECRET_VALUE" \
              Environment="$ENVIRONMENT" \
              $( [ -n "$KMS_KEY_ID" ] && echo KmsKeyId="$KMS_KEY_ID" ) \
            --no-fail-on-empty-changeset

          if [ $? -ne 0 ]; then
            echo "❌ UPDATE failed → showing events"
            aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --output table | head -n 50

            echo "⏳ Waiting for rollback..."
            aws cloudformation wait stack-rollback-complete --stack-name "$STACK_NAME"

            exit 1
          fi

      # ------------------------------------------
      # DELETE
      # ------------------------------------------
      - name: Delete Secret Stack
        if: ${{ env.OPERATION == 'delete' }}
        run: |
          if [ -z "$STACK_NAME_INPUT" ]; then
            echo "❌ stack_name is required for delete"
            exit 1
          fi

          STACK_NAME="$STACK_NAME_INPUT"

          echo "🗑 Deleting stack: $STACK_NAME"

          aws cloudformation delete-stack --stack-name "$STACK_NAME"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"

          echo "✅ Stack deleted"

      # ------------------------------------------
      # GET SECRET ARN (CREATE/UPDATE ONLY)
      # ------------------------------------------
      - name: Get Secret ARN
        if: ${{ env.OPERATION != 'delete' }}
        run: |
          STACK_NAME="${STACK_NAME:-$STACK_NAME_INPUT}"

          SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='SecretArn'].OutputValue" \
            --output text)

          echo "secret-arn=$SECRET_ARN" >> $GITHUB_ENV
          echo "🔐 SECRET ARN: $SECRET_ARN"
