name: Create/Update/Delete AWS Secret via CloudFormation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to perform (create/update/delete)"
        required: true
        type: choice
        options:
          - create
          - update
          - delete

      parameter_file:
        description: "Parameter file name (for create/update)"
        required: false
        default: "secret-params.json"

      environment:
        description: "Environment (dev/qa/staging/perf)"
        required: false
        type: choice
        options:
          - dev
          - qa
          - staging
          - perf

      stack_name:
        description: "Stack name (required for update/delete)"
        required: false

env:
  AWS_REGION: ap-south-1
  CF_TEMPLATE_PATH: cloudformation/secret-manager/secret-service.yaml
  PARAM_DIR: parameters/

jobs:
  secret-ops:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::789406175361:role/GitHubActionsOIDCRole
          aws-region: ap-south-1
          role-session-name: GitHubActions-SecretOps

      # ============================================================
      # Load user inputs into environment variables
      # ============================================================
      - name: Load Inputs into Variables
        id: load-inputs
        run: |
          echo "OPERATION=${{ inputs.operation }}" >> $GITHUB_ENV
          echo "PARAM_FILE=${{ env.PARAM_DIR }}${{ inputs.parameter_file }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
          echo "STACK_NAME_INPUT=${{ inputs.stack_name }}" >> $GITHUB_ENV
          echo "CF_TEMPLATE=${{ env.CF_TEMPLATE_PATH }}" >> $GITHUB_ENV

          echo "Loaded Values:"
          echo "Operation: $OPERATION"
          echo "Parameter file: $PARAM_FILE"
          echo "Environment: $ENVIRONMENT"
          echo "Provided stack name: $STACK_NAME_INPUT"
          echo "Template Path: $CF_TEMPLATE"

      # ============================================================
      # Read param file (CREATE & UPDATE only)
      # ============================================================
      - name: Read Parameter File
        if: ${{ inputs.operation != 'delete' }}
        id: read-params
        run: |
          echo "Reading parameter file: $PARAM_FILE"

          if [ ! -f "$PARAM_FILE" ]; then
            echo "❌ Parameter file not found: $PARAM_FILE"
            exit 1
          fi

          SECRET_NAME=$(jq -r '.SecretName' "$PARAM_FILE")
          SECRET_DESCRIPTION=$(jq -r '.Description // "Managed by CloudFormation"' "$PARAM_FILE")
          SECRET_VALUE=$(jq -c '.SecretValue' "$PARAM_FILE")
          KMS_KEY_ID=$(jq -r '.KmsKeyId // ""' "$PARAM_FILE")

          echo "::add-mask::$SECRET_VALUE"

          # Export values to GitHub outputs
          echo "secret-name=$SECRET_NAME" >> $GITHUB_OUTPUT
          echo "secret-description=$SECRET_DESCRIPTION" >> $GITHUB_OUTPUT
          echo "kms-key-id=$KMS_KEY_ID" >> $GITHUB_OUTPUT

          {
            echo "secret-value<<EOF"
            echo "$SECRET_VALUE"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          # For CREATE: construct stack name
          if [ "$OPERATION" = "create" ]; then
            STACK_NAME="secret-${SECRET_NAME}-${ENVIRONMENT}"
            echo "stack-name=$STACK_NAME" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # CREATE operation
      # ============================================================
      - name: CREATE Secret Stack
        if: ${{ inputs.operation == 'create' }}
        id: create-stack
        run: |
          STACK_NAME="${{ steps.read-params.outputs.stack-name }}"
          echo "STACK_NAME=$STACK_NAME" >> $GITHUB_ENV

          echo "🚀 Creating stack: $STACK_NAME"

          aws cloudformation deploy \
            --template-file "$CF_TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              SecretName="${{ steps.read-params.outputs.secret-name }}" \
              SecretDescription="${{ steps.read-params.outputs.secret-description }}" \
              SecretValue="${{ steps.read-params.outputs.secret-value }}" \
              Environment="$ENVIRONMENT" \
              $( [ -n "${{ steps.read-params.outputs.kms-key-id }}" ] && echo KmsKeyId="${{ steps.read-params.outputs.kms-key-id }}" ) \
            --no-fail-on-empty-changeset

          if [ $? -ne 0 ]; then
            echo "❌ CREATE failed – fetching events"
            aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --output table | head -n 50
            
            echo "🧹 Deleting failed stack..."
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
            exit 1
          fi

      # ============================================================
      # UPDATE operation
      # ============================================================
      - name: UPDATE Secret Stack
        if: ${{ inputs.operation == 'update' }}
        id: update-stack
        run: |
          if [ -z "$STACK_NAME_INPUT" ]; then
            echo "❌ stack_name is required for update"
            exit 1
          fi

          STACK_NAME="$STACK_NAME_INPUT"
          echo "STACK_NAME=$STACK_NAME" >> $GITHUB_ENV

          echo "🔄 Updating stack: $STACK_NAME"

          aws cloudformation deploy \
            --template-file "$CF_TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              SecretName="${{ steps.read-params.outputs.secret-name }}" \
              SecretDescription="${{ steps.read-params.outputs.secret-description }}" \
              SecretValue="${{ steps.read-params.outputs.secret-value }}" \
              Environment="$ENVIRONMENT" \
              $( [ -n "${{ steps.read-params.outputs.kms-key-id }}" ] && echo KmsKeyId="${{ steps.read-params.outputs.kms-key-id }}" ) \
            --no-fail-on-empty-changeset

          if [ $? -ne 0 ]; then
            echo "❌ UPDATE failed – waiting for rollback..."
            aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --output table | head -n 50
            aws cloudformation wait stack-rollback-complete --stack-name "$STACK_NAME"
            exit 1
          fi

      # ============================================================
      # DELETE operation
      # ============================================================
      - name: DELETE Secret Stack
        id: delete-stack
        if: ${{ inputs.operation == 'delete' }}
        run: |
          if [ -z "$STACK_NAME_INPUT" ]; then
            echo "❌ stack_name is required for delete"
            exit 1
          fi

          STACK_NAME="$STACK_NAME_INPUT"

          echo "🗑 Deleting stack: $STACK_NAME"

          aws cloudformation delete-stack --stack-name "$STACK_NAME"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"

          echo "✅ Stack deleted successfully"

      # ============================================================
      # GET ARN (CREATE & UPDATE only)
      # ============================================================
      - name: Get Secret ARN
        if: ${{ inputs.operation != 'delete' }}
        run: |
          if [ "$OPERATION" = "create" ]; then
            STACK_NAME="${{ steps.read-params.outputs.stack-name }}"
          else
            STACK_NAME="$STACK_NAME_INPUT"
          fi

          SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='SecretArn'].OutputValue" \
            --output text)

          echo "secret-arn=$SECRET_ARN" >> $GITHUB_OUTPUT
          echo "SECRET ARN: $SECRET_ARN"
