name: Create/Update/Delete AWS Secret via CloudFormation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation (create/update/delete)"
        required: true
        type: choice
        options:
          - create
          - update
          - delete

      secret_name:
        description: "Secret Name"
        required: true

      description:
        description: "Secret Description"
        required: false
        default: "Managed by CloudFormation"

      secret_value:
        description: "Secret Value (JSON: {\"username\":\"admin\",\"password\":\"pwd\"})"
        required: false

      kms_key_id:
        description: "KMS Key ID (optional)"
        required: false
        default: ""

      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - staging
          - perf
          - prod

      stack_name:
        description: "Stack name (required for update/delete)"
        required: false

      dr_enabled:
        description: "Enable Disaster Recovery (cross-region replication)"
        required: true
        type: boolean
        default: false

      dr_region:
        description: "DR Region (required if DR enabled, e.g., ap-southeast-1)"
        required: false
        default: ""

env:
  AWS_REGION: ap-south-1

jobs:
  secret-ops:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Validate Inputs
      # -------------------------------------------------------
      - name: Validate Inputs
        id: validate
        run: |
          OPERATION="${{ github.event.inputs.operation }}"
          DR_ENABLED="${{ github.event.inputs.dr_enabled }}"
          DR_REGION="${{ github.event.inputs.dr_region }}"
          SECRET_VALUE="${{ github.event.inputs.secret_value }}"
          STACK_INPUT="${{ github.event.inputs.stack_name }}"

          # Validate DR settings
          if [ "$DR_ENABLED" = "true" ] && [ -z "$DR_REGION" ]; then
            echo "❌ ERROR: DR is enabled but DR region is not provided"
            exit 1
          fi

          # Validate secret_value for create/update
          if [ "$OPERATION" = "create" ] || [ "$OPERATION" = "update" ]; then
            if [ -z "$SECRET_VALUE" ]; then
              echo "❌ ERROR: Secret value is required for $OPERATION operation"
              exit 1
            fi
          fi

          # Validate stack_name for update/delete
          if [ "$OPERATION" = "update" ] || [ "$OPERATION" = "delete" ]; then
            if [ -z "$STACK_INPUT" ]; then
              echo "❌ ERROR: Stack name is required for $OPERATION operation"
              exit 1
            fi
          fi

          echo "✅ Input validation passed"

      # -------------------------------------------------------
      # Determine AWS Role based on Environment
      # -------------------------------------------------------
      - name: Determine AWS Role
        id: determine-role
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          
          if [ "$ENVIRONMENT" = "prod" ]; then
            ROLE_ARN="${{ secrets.PROD_AWS_OIDC_ROLE_ARN }}"
            echo "Using PROD AWS OIDC Role"
          else
            ROLE_ARN="${{ secrets.AWS_ROLE_ARN_STAGING }}"
            echo "Using NON-PROD AWS OIDC Role"
          fi

          if [ -z "$ROLE_ARN" ]; then
            echo "❌ ERROR: AWS Role ARN not found for environment: $ENVIRONMENT"
            exit 1
          fi

          echo "role-arn=$ROLE_ARN" >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # Configure AWS Credentials
      # -------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.determine-role.outputs.role-arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-SecretOps-${{ github.event.inputs.environment }}

      # -------------------------------------------------------
      # Initialize & Prepare Inputs
      # -------------------------------------------------------
      - name: Initialize Inputs
        id: init
        run: |
          echo "operation=${{ github.event.inputs.operation }}" >> $GITHUB_OUTPUT
          echo "secret-name=${{ github.event.inputs.secret_name }}" >> $GITHUB_OUTPUT
          echo "secret-description=${{ github.event.inputs.description }}" >> $GITHUB_OUTPUT

          # Mask the secret value
          echo "::add-mask::${{ github.event.inputs.secret_value }}"
          echo "secret-value<<EOF" >> $GITHUB_OUTPUT
          echo "${{ github.event.inputs.secret_value }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "kms-key-id=${{ github.event.inputs.kms_key_id }}" >> $GITHUB_OUTPUT
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          echo "dr-enabled=${{ github.event.inputs.dr_enabled }}" >> $GITHUB_OUTPUT
          echo "dr-region=${{ github.event.inputs.dr_region }}" >> $GITHUB_OUTPUT

          # Compute stack name for CREATE
          STACK="secret-${{ github.event.inputs.secret_name }}-${{ github.event.inputs.environment }}"
          echo "computed-stack-name=$STACK" >> $GITHUB_OUTPUT

          # Stack name input for update/delete
          echo "stack-input=${{ github.event.inputs.stack_name }}" >> $GITHUB_OUTPUT

          echo "cf-template=cloudformation/secret-manager/secret-service.yaml" >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # CREATE
      # -------------------------------------------------------
      - name: CREATE Secret Stack
        if: ${{ steps.init.outputs.operation == 'create' }}
        id: create
        run: |
          STACK_NAME="${{ steps.init.outputs.computed-stack-name }}"
          DR_ENABLED="${{ steps.init.outputs.dr-enabled }}"
          DR_REGION="${{ steps.init.outputs.dr-region }}"

          PARAMS="SecretName=${{ steps.init.outputs.secret-name }} \
                  SecretDescription=${{ steps.init.outputs.secret-description }} \
                  SecretValue=${{ steps.init.outputs.secret-value }} \
                  Environment=${{ steps.init.outputs.environment }} \
                  DREnabled=$DR_ENABLED"

          # Add KMS Key if provided
          if [ -n "${{ steps.init.outputs.kms-key-id }}" ]; then
            PARAMS="$PARAMS KmsKeyId=${{ steps.init.outputs.kms-key-id }}"
          fi

          # Add DR Region if DR is enabled
          if [ "$DR_ENABLED" = "true" ]; then
            PARAMS="$PARAMS DRRegion=$DR_REGION"
          fi

          aws cloudformation deploy \
            --template-file "${{ steps.init.outputs.cf-template }}" \
            --stack-name "$STACK_NAME" \
            --parameter-overrides $PARAMS \
            --no-fail-on-empty-changeset

          echo "stack-name=$STACK_NAME" >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # UPDATE
      # -------------------------------------------------------
      - name: UPDATE Secret Stack
        if: ${{ steps.init.outputs.operation == 'update' }}
        id: update
        run: |
          STACK_NAME="${{ steps.init.outputs.stack-input }}"
          DR_ENABLED="${{ steps.init.outputs.dr-enabled }}"
          DR_REGION="${{ steps.init.outputs.dr-region }}"

          PARAMS="SecretName=${{ steps.init.outputs.secret-name }} \
                  SecretDescription=${{ steps.init.outputs.secret-description }} \
                  SecretValue=${{ steps.init.outputs.secret-value }} \
                  Environment=${{ steps.init.outputs.environment }} \
                  DREnabled=$DR_ENABLED"

          # Add KMS Key if provided
          if [ -n "${{ steps.init.outputs.kms-key-id }}" ]; then
            PARAMS="$PARAMS KmsKeyId=${{ steps.init.outputs.kms-key-id }}"
          fi

          # Add DR Region if DR is enabled
          if [ "$DR_ENABLED" = "true" ]; then
            PARAMS="$PARAMS DRRegion=$DR_REGION"
          fi

          aws cloudformation deploy \
            --template-file "${{ steps.init.outputs.cf-template }}" \
            --stack-name "$STACK_NAME" \
            --parameter-overrides $PARAMS \
            --no-fail-on-empty-changeset

          echo "stack-name=$STACK_NAME" >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # DELETE
      # -------------------------------------------------------
      - name: DELETE Secret Stack
        if: ${{ steps.init.outputs.operation == 'delete' }}
        id: delete
        run: |
          STACK_NAME="${{ steps.init.outputs.stack-input }}"

          aws cloudformation delete-stack --stack-name "$STACK_NAME"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"

          echo "stack-name=$STACK_NAME" >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # GET SECRET ARN
      # -------------------------------------------------------
      - name: Get Secret ARN
        id: arn
        if: ${{ steps.init.outputs.operation != 'delete' }}
        run: |
          STACK_NAME="${{ steps.create.outputs.stack-name || steps.update.outputs.stack-name }}"

          SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='SecretArn'].OutputValue" \
            --output text)

          echo "secret-arn=$SECRET_ARN" >> $GITHUB_OUTPUT

          # Get DR Secret ARN if DR is enabled
          if [ "${{ steps.init.outputs.dr-enabled }}" = "true" ]; then
            DR_SECRET_ARN=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='DRSecretArn'].OutputValue" \
              --output text 2>/dev/null || echo "N/A")
            
            echo "dr-secret-arn=$DR_SECRET_ARN" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------------
      # DISPLAY SUMMARY
      # -------------------------------------------------------
      - name: Display Summary
        run: |
          OP="${{ steps.init.outputs.operation }}"
          ENV="${{ steps.init.outputs.environment }}"
          CF_TEMPLATE="${{ steps.init.outputs.cf-template }}"
          REGION="${{ env.AWS_REGION }}"
          STACK_INPUT="${{ steps.init.outputs.stack-input }}"
          DR_ENABLED="${{ steps.init.outputs.dr-enabled }}"
          DR_REGION="${{ steps.init.outputs.dr-region }}"

          if [ "$OP" = "create" ]; then
            STACK_NAME="${{ steps.create.outputs.stack-name }}"
          elif [ "$OP" = "update" ]; then
            STACK_NAME="$STACK_INPUT"
          else
            STACK_NAME="$STACK_INPUT"
          fi

          echo "## 📘 Secret Operation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Operation** | $OP |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | $ENV |" >> $GITHUB_STEP_SUMMARY
          echo "| **CloudFormation Template** | $CF_TEMPLATE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stack Name** | $STACK_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| **Primary Region** | $REGION |" >> $GITHUB_STEP_SUMMARY
          echo "| **DR Enabled** | $DR_ENABLED |" >> $GITHUB_STEP_SUMMARY
          
          if [ "$DR_ENABLED" = "true" ]; then
            echo "| **DR Region** | $DR_REGION |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "| **Timestamp** | $(date) |" >> $GITHUB_STEP_SUMMARY

          if [ "$OP" != "delete" ]; then
            SECRET_NAME="${{ steps.init.outputs.secret-name }}"
            SECRET_DESC="${{ steps.init.outputs.secret-description }}"
            KMS_KEY="${{ steps.init.outputs.kms-key-id }}"
            SECRET_ARN="${{ steps.arn.outputs.secret-arn }}"
            DR_SECRET_ARN="${{ steps.arn.outputs.dr-secret-arn }}"

            echo "| **Secret Name** | $SECRET_NAME |" >> $GITHUB_STEP_SUMMARY
            echo "| **Description** | $SECRET_DESC |" >> $GITHUB_STEP_SUMMARY
            echo "| **KMS Key ID** | ${KMS_KEY:-Default} |" >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔐 Secret ARN (Primary Region)" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$SECRET_ARN" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            if [ "$DR_ENABLED" = "true" ] && [ "$DR_SECRET_ARN" != "N/A" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🌐 DR Secret ARN ($DR_REGION)" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "$DR_SECRET_ARN" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🗑 Delete Status" >> $GITHUB_STEP_SUMMARY
            echo "Stack **$STACK_NAME** deleted successfully." >> $GITHUB_STEP_SUMMARY
          fi
