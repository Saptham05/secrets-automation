AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template to create AWS Secrets Manager secret with optional DR support'

Parameters:
  SecretName:
    Type: String
    Description: Name of the secret to create
    MinLength: 1
    MaxLength: 512
    AllowedPattern: '[\w+=,.@-]+'
    ConstraintDescription: Must contain only alphanumeric characters and +=,.@-

  SecretDescription:
    Type: String
    Description: Description of the secret
    Default: 'Managed by CloudFormation via GitHub Actions'
    MaxLength: 2048

  SecretValue:
    Type: String
    Description: The secret value (can be plaintext or JSON string)
    NoEcho: true
    MinLength: 1

  Environment:
    Type: String
    Description: Environment name
    AllowedValues:
      - dev
      - qa
      - staging
      - perf
      - prod
    Default: dev

  KmsKeyId:
    Type: String
    Description: KMS Key ID for encryption (leave empty to use default aws/secretsmanager key)
    Default: ''

  DREnabled:
    Type: String
    Description: Enable disaster recovery with cross-region replication
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'

  DRRegion:
    Type: String
    Description: DR region for cross-region replication (required if DREnabled is true)
    Default: ''
    AllowedPattern: '^(|[a-z]{2}-[a-z]+-[0-9]{1})$'
    ConstraintDescription: Must be a valid AWS region or empty

Conditions:
  UseCustomKmsKey: !Not [!Equals [!Ref KmsKeyId, '']]
  EnableDR: !Equals [!Ref DREnabled, 'true']

Resources:
  Secret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref SecretName
      Description: !Ref SecretDescription
      SecretString: !Ref SecretValue
      KmsKeyId: !If 
        - UseCustomKmsKey
        - !Ref KmsKeyId
        - !Ref AWS::NoValue
      ReplicaRegions: !If
        - EnableDR
        - - Region: !Ref DRRegion
            KmsKeyId: !If
              - UseCustomKmsKey
              - !Ref KmsKeyId
              - !Ref AWS::NoValue
        - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Ref SecretName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CreatedBy
          Value: GitHub-Actions
        - Key: DREnabled
          Value: !Ref DREnabled
        - Key: DRRegion
          Value: !If
            - EnableDR
            - !Ref DRRegion
            - 'N/A'

  # Secret rotation configuration (optional - uncomment if needed)
  # SecretRotationSchedule:
  #   Type: AWS::SecretsManager::RotationSchedule
  #   Properties:
  #     SecretId: !Ref Secret
  #     RotationLambdaARN: !Ref RotationLambdaArn
  #     RotationRules:
  #       AutomaticallyAfterDays: 30

Outputs:
  SecretArn:
    Description: ARN of the created secret in the primary region
    Value: !Ref Secret
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'

  SecretName:
    Description: Name of the created secret
    Value: !Ref SecretName
    Export:
      Name: !Sub '${AWS::StackName}-SecretName'

  StackName:
    Description: Name of the CloudFormation stack
    Value: !Ref AWS::StackName

  Environment:
    Description: Environment tag
    Value: !Ref Environment

  DREnabled:
    Description: Whether DR is enabled
    Value: !Ref DREnabled

  DRRegion:
    Description: DR region (if enabled)
    Value: !If
      - EnableDR
      - !Ref DRRegion
      - 'N/A'
    Condition: EnableDR

  DRSecretArn:
    Description: ARN of the replicated secret in DR region
    Value: !Sub 
      - 'arn:aws:secretsmanager:${DRRegion}:${AWS::AccountId}:secret:${SecretName}'
      - DRRegion: !Ref DRRegion
    Condition: EnableDR
    Export:
      Name: !Sub '${AWS::StackName}-DRSecretArn'
